# Конфіг nginx для CareBridge.
# Копіюється на сервер у /etc/nginx/sites-available/carebridge
#
# Блок з HTTPS сюди допише certbot автоматично — не додавайте його вручну.

server {
    listen 80;
    listen [::]:80;
    server_name carebridge.cc www.carebridge.cc;

    # Завантаження зображень в оголошення та історії
    client_max_body_size 20M;

    # Зібраний фронтенд (frontend/dist, залитий з локальної машини)
    root /srv/carebridge/frontend/dist;
    index index.html;

    # React Router: будь-який невідомий шлях віддаємо index.html,
    # інакше пряме відкриття /volunteers/12 дасть 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Django ---------------------------------------------------------

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Запити до Gemini з ретраями можуть тривати довго
        proxy_read_timeout 120s;
    }

    # Адмінка (шлях заданий у server/urls.py)
    location /controlVolunteer/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ckeditor/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (чат і сповіщення) -----------------------------------

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Щоб з'єднання не рвалося під час паузи в листуванні
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Статика і медіа ------------------------------------------------
    # На проді DEBUG=False, тому Django їх більше не роздає — це робить nginx

    location /static/ {
        alias /srv/carebridge/backend/server/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/carebridge/backend/server/media/;
        expires 7d;
    }
}
